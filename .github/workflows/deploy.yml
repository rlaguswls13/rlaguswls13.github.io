name: Deploy Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: pages-production
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: read
      pages: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Resolve GitHub Pages base path
        id: resolve-pages-path
        env:
          REPOSITORY_NAME: ${{ github.event.repository.name }}
          REPOSITORY_OWNER: ${{ github.repository_owner }}
          FORCE_ROOT: ${{ vars.USE_ROOT_BASE_PATH }}
        run: |
          repository_name="${REPOSITORY_NAME,,}"
          root_repository="${REPOSITORY_OWNER,,}.github.io"
          force_root="${FORCE_ROOT,,}"
          if [ "$force_root" = "true" ] || [ "$repository_name" = "$root_repository" ]; then
            echo "base_path=ROOT" >> "$GITHUB_OUTPUT"
          else
            echo "base_path=/$REPOSITORY_NAME" >> "$GITHUB_OUTPUT"
          fi
      - name: Build static export
        env:
          BASE_PATH: ${{ steps.resolve-pages-path.outputs.base_path }}
          ADSENSE_ACCOUNT: ${{ vars.ADSENSE_ACCOUNT }}
          GA4_PROPERTY_ID: ${{ vars.GA4_PROPERTY_ID }}
        run: npm run build:no-fetch
      - name: Publish AdSense ads.txt when configured
        if: ${{ vars.ADSENSE_ACCOUNT != '' }}
        env:
          ADSENSE_ACCOUNT: ${{ vars.ADSENSE_ACCOUNT }}
        run: |
          publisher_id="${ADSENSE_ACCOUNT#ca-}"
          printf 'google.com, %s, DIRECT, f08c47fec0942fa0\n' "$publisher_id" > out/ads.txt
      - uses: actions/configure-pages@v5
      - name: Upload verified Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
