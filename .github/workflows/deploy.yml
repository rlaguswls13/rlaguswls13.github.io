name: Deploy Pages

on:
  push:
    branches: ["main"]
  workflow_run:
    workflows: ["Fetch Notion content"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-production
  cancel-in-progress: true

jobs:
  deploy:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: pages-production
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: read
      id-token: write
      pages: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Resolve GitHub Pages base path
        id: resolve-pages-path
        env:
          REPOSITORY_NAME: ${{ github.event.repository.name }}
          REPOSITORY_OWNER: ${{ github.repository_owner }}
          FORCE_ROOT: ${{ vars.USE_ROOT_BASE_PATH }}
        run: node scripts/deploy/resolve-pages-path.mjs
      - name: Build static export
        env:
          BASE_PATH: ${{ steps.resolve-pages-path.outputs.base_path }}
          ADSENSE_ACCOUNT: ${{ vars.ADSENSE_ACCOUNT }}
          GA4_PROPERTY_ID: ${{ vars.GA4_PROPERTY_ID }}
          SEARCH_CONSOLE_VERIFICATION: ${{ vars.SEARCH_CONSOLE_VERIFICATION }}
        run: npm run build:no-fetch
      - name: Publish AdSense ads.txt
        env:
          ADSENSE_ACCOUNT: ${{ vars.ADSENSE_ACCOUNT }}
        run: node scripts/deploy/publish-ads-txt.mjs
      - uses: actions/configure-pages@v5
      - name: Upload verified Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
