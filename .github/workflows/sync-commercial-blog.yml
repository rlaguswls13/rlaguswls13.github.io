name: Sync commercial blog

on:
  workflow_run:
    workflows: ["Deploy verified Pages"]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: commercial-sync
  cancel-in-progress: false

jobs:
  sync:
    if: ${{ github.event.workflow_run.conclusion == 'success' && vars.TARGET_REPO != '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Push to commercial target repository
        env:
          GITHUB_TOKEN: ${{ secrets.COMMERCIAL_REPO_PAT }}
          TARGET_REPO: ${{ vars.TARGET_REPO }}
        run: |
          git remote add commercial "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY_OWNER}/${TARGET_REPO}.git"
          git push commercial HEAD:main --force
