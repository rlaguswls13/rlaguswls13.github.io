name: Fetch Notion content

on:
  schedule:
    - cron: "0 3,15 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: notion-fetch
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Fetch Notion sources
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DATA_SOURCE_ID_JOURNAL: ${{ secrets.NOTION_DATA_SOURCE_ID_JOURNAL }}
          NOTION_DATA_SOURCE_ID_DEVLOG: ${{ secrets.NOTION_DATA_SOURCE_ID_DEVLOG }}
          NOTION_DATA_SOURCE_ID_PROJECT: ${{ secrets.NOTION_DATA_SOURCE_ID_PROJECT }}
          NOTION_REQUIRED_GROUPS: journal,devlog,project
        run: npm run fetch-notion
      - name: Commit fetched content
        run: node scripts/notion/commit-sync.mjs
